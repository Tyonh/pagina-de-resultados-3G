# Nginx para a Página de Resultados (site estático).
# Na VPS: troque "root" pela pasta site/ do projeto e "server_name" pelo subdomínio.

server {
    listen 80;
    server_name relatorio.grupo3giluminacao.com.br;

    root /var/www/pagina-resultados/site;
    index index.html;

    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # HTML, JS e CSS sempre revalidados: a TV pega atualizações sem limpar cache
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # Imagens (fotos de ~3 MB): cache de 1 dia para não baixar toda vez
    location /public/ {
        expires 1d;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Não expor arquivos ocultos
    location ~ /\. { deny all; }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
